services:
  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mmut-orchestrator
    image: frittenburger/mmut-orchestrator:docker-test5
    command: ["/app/scripts/start-services.sh"]
    ports:
      - "4200:4200"
      - "8002:8002"
    volumes:
      - ./config:/app/config
      - ./mmut:/app/mmut
      - ./shared:/app/shared
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - PREFECT_API_HOST=0.0.0.0
      - PREFECT_API_URL=http://127.0.0.1:4200/api
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8002/health >/dev/null && curl -fsS http://localhost:4200/api/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 25s
